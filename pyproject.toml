[project]
name = "titeny-ai-models"
version = "0.1.0"
requires-python = "==3.12.7"
dependencies = [
  "scikit-learn==1.5.2",
  "pandas==2.2.3",
  "numpy==2.1.3",
  "onnx==1.20.0",
  "onnxruntime==1.20.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "ruff==0.8.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
